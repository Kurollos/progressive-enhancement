<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>File upload met preview / Progressive Enhancement / FDND</title>
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<link href="assets/styles.css" rel="stylesheet">
		

	<style>
		body {
			font-family: sans-serif;
		}

		form {
			background: #2ecc71; /* groen */
			padding: 50px;
			border-radius: 12px;
			display: grid;
			gap: 1rem;
			width: 790px;
			height: 320px;
			cursor: pointer;
			position: relative;
		}

		/* verberg input maar houd hem functioneel */
		input[type="file"] {
			display: none;
		}

		.preview {
			width: 100%;
			height: 200px;
			background: rgba(255,255,255,0.3);
			border-radius: 10px;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		.preview img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		button {
			align-self: end; /* knop naar onder rechts */
			background: #1e3a8a; /* donkerblauw */
			color: white;
			border: none;
			border-radius: 6px;
			padding: 6px 12px;
			font-size: 12px;
			cursor: pointer;
		}

		button:hover {
			background: #162c66;
		}
	</style>
</head>

<body>

<h1>File upload met preview</h1>

<form id="uploadForm">
	<input type="file" accept="image/*">

	<!-- preview -->
	<div class="preview">
		<p>Selecteer de afbeelding</p>
	</div>

	<!-- upload knop -->
	<button type="submit">Uploaden</button>
</form>

<script type="module">
	const form = document.querySelector('#uploadForm');
	const input = form.querySelector('input[type="file"]');
	const preview = document.querySelector('.preview');

	// klik op form opent file picker (maar niet als je op button klikt)
	form.addEventListener('click', (e) => {
		if (e.target.tagName === 'BUTTON') return;
		input.click();
	});

	// preview tonen na selectie
	input.addEventListener('change', () => {
		const file = input.files[0];
		if (!file) return;

		if (!file.type.startsWith('image/')) return;

		const url = URL.createObjectURL(file);

		preview.innerHTML = `<img src="${url}" alt="preview">`;
	});
</script>

		<details open>
			<summary>Demo video</summary>
			<video src="assets/file.mp4" width="1496" height="496" controls muted autoplay loop>
				<a href="assets/file.mp4">assets/file.mp4</a>
			</video>
		</details>
	</body>
</html>
